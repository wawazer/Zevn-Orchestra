<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #0B0E13); }
  #term { position: absolute; inset: 6px 4px 4px 10px; }
  .xterm .xterm-viewport { scrollbar-width: thin; }
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 4px; }
  #ac { position: absolute; display: none; width: 440px; z-index: 10; font: 12.5px "Segoe UI Variable Text", "Segoe UI", sans-serif;
        border-radius: 10px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.35); backdrop-filter: blur(18px);
        border: 1px solid var(--stroke); background: var(--panel); color: var(--fg); }
  #ac .row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 10px; cursor: default; }
  #ac .row.sel { background: var(--sel); }
  #ac .ico { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font: 12px "Segoe Fluent Icons", "Segoe MDL2 Assets"; flex: none; }
  #ac .txt { font: 12.5px "Cascadia Mono", Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #ac .txt b { color: var(--accent); font-weight: 600; }
  #ac .lbl { font-size: 11px; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  #ac .foot { display: flex; gap: 12px; padding: 6px 10px 7px; font-size: 10.5px; opacity: .6; border-top: 1px solid var(--stroke); }
  #ac kbd { font: 10px "Cascadia Mono", Consolas, monospace; padding: 0 4px; border-radius: 4px; background: var(--stroke); margin-right: 3px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="ac"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="term.js"></script>
</body>
</html>
